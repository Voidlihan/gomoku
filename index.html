<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GoMoKu Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f0f0; }
        #status { font-size: 20px; margin: 10px; font-weight: bold; }
        #board { 
            display: grid; 
            grid-template-columns: repeat(10, 40px); 
            grid-template-rows: repeat(10, 40px); 
            gap: 2px; 
            justify-content: center; 
            margin-top: 20px;
        }
        .cell { 
            width: 40px; 
            height: 40px; 
            background-color: #e0ae6e; /* Цвет деревянной доски */
            border: 1px solid #8b5a2b; 
            font-size: 24px; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell.black::after { content: "⚫"; }
        .cell.white::after { content: "⚪"; }
    </style>
</head>
<body>

    <h1>GoMoKu (Connect 5)</h1>
    <div id="status">Connecting to server...</div>
    <div id="board"></div>

    <script src="/socket.io/socket.io.js"></script>
<script>
    // Подключаемся к серверу (работает автоматически и на localhost, и на Render)
    const socket = io();

    let myColor = null;
    let isMyTurn = false;
    const statusDiv = document.getElementById('status');
    const boardDiv = document.getElementById('board');

    // Генерируем сетку 10x10
    for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 10; c++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.row = r;
            cell.dataset.col = c;
            cell.addEventListener('click', makeMove);
            boardDiv.appendChild(cell);
        }
    }

    // Слушаем события от Socket.io
    socket.on('init', (data) => {
        myColor = data.color;
        statusDiv.innerText = data.message;
    });

    socket.on('start', (data) => {
        isMyTurn = data.turn;
        statusDiv.innerText = data.message;
    });

    socket.on('update', (data) => {
        const cell = document.querySelector(`[data-row='${data.row}'][data-col='${data.col}']`);
        if (cell) cell.classList.add(data.color);
    });

    socket.on('your_turn', () => {
        isMyTurn = true;
        statusDiv.innerText = "Ваш ход!";
    });

    socket.on('error_msg', (msg) => {
        alert(msg);
    });

    socket.on('gameover', (msg) => {
        alert(msg);
        location.reload();
    });

    function makeMove(e) {
        if (!isMyTurn) {
            alert("Сейчас не ваш ход!");
            return;
        }
        const row = e.target.dataset.row;
        const col = e.target.dataset.col;

        // Отправляем ход на сервер через событие 'move'
        socket.emit('move', {
            row: parseInt(row),
            col: parseInt(col)
        });
    }
</script>
</body>
</html>
